<!doctype html>
<html lang="ko" data-theme="girok" data-mode="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>girok pass2 capture</title>
    <link rel="stylesheet" href="../packages/design/dist/css/core.css" />
    <link rel="stylesheet" href="../packages/design/dist/css/themes/girok.css" />
    <link rel="stylesheet" href="../packages/design/dist/patterns/girok-app.css" />
    <style>
      body {
        min-height: 100vh;
        background:
          radial-gradient(circle at top, color-mix(in oklab, var(--vds-exp-girok-redesign-nav-tab-active) 18%, transparent), transparent 42%),
          var(--vds-exp-girok-redesign-shell-frame-surface);
        color: var(--vds-theme-text-bright);
        font-family: var(--vds-font-family-sans);
      }

      .phone {
        width: 360px;
        min-height: 852px;
        margin: 0 auto;
        background: linear-gradient(180deg, var(--vds-exp-girok-redesign-shell-frame-surface), var(--vds-exp-girok-redesign-shell-content-surface));
        overflow: hidden;
        position: relative;
      }

      .header {
        padding: 20px 20px 12px;
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .register-chip {
        border: 0;
        border-radius: 999px;
        padding: 10px 16px;
        background: var(--vds-exp-girok-redesign-nav-tab-active);
        color: var(--vds-exp-girok-redesign-shell-frame-surface);
        font-size: 13px;
        font-weight: 800;
        box-shadow: inset 0 -1px 0 color-mix(in oklab, var(--vds-exp-girok-redesign-shell-frame-surface) 22%, transparent);
      }

      .section {
        padding: 0 20px;
      }

      .vds-pattern-girok-tab-l2 {
        margin-top: 16px;
        background: var(--vds-exp-girok-redesign-surface-toolbar);
      }

      .vds-pattern-girok-tab-l2__indicator {
        transform: translateX(calc(100% + var(--vds-spacing-1)));
      }

      .stats-wrap {
        margin-top: 16px;
      }

      .sheet-stage {
        position: absolute;
        inset-inline: 0;
        top: 0;
        bottom: 0;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        pointer-events: none;
      }

      .vds-pattern-bottomsheet__backdrop {
        position: absolute;
        z-index: 0;
      }

      .vds-pattern-bottomsheet__sheet {
        width: 100%;
        max-width: 360px;
        pointer-events: auto;
        position: relative;
        z-index: 1;
      }

      .subtitle-stat-income {
        color: var(--vds-exp-girok-redesign-stats-income-text);
      }

      .subtitle-stat-expense {
        color: var(--vds-exp-girok-redesign-stats-expense-text);
      }

      .subtitle-sep {
        color: color-mix(in oklab, var(--vds-theme-text-dim) 80%, transparent);
      }

      .entry-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px;
        border-radius: 18px;
        background: var(--vds-exp-girok-redesign-surface-card);
        box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--vds-exp-girok-redesign-border-control) 80%, transparent);
      }

      .entry-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .entry-icon {
        width: 42px;
        height: 42px;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: color-mix(in oklab, var(--vds-exp-girok-redesign-nav-tab-active) 24%, transparent);
        color: var(--vds-exp-girok-redesign-nav-tab-active);
        font-weight: 800;
      }

      .entry-title {
        color: var(--vds-theme-text-bright);
        font-size: 14px;
        font-weight: 700;
      }

      .entry-subtitle {
        margin-top: 4px;
        color: var(--vds-theme-text-dim);
        font-size: 12px;
      }

      .entry-amount {
        color: var(--vds-exp-girok-redesign-stats-income-text);
        font-size: 15px;
        font-weight: 800;
      }

      .sheet-header-copy {
        min-width: 0;
        flex: 1;
      }
    </style>
  </head>
  <body>
    <main class="phone">
      <div class="header">
        <div class="row">
          <div class="vds-pattern-girok-wordmark">girok<span class="vds-pattern-girok-wordmark__dot">.</span></div>
          <button class="register-chip">등록</button>
        </div>
      </div>

      <nav class="vds-pattern-girok-tab-l1">
        <div class="vds-pattern-girok-tab-l1__scroll">
          <button class="vds-pattern-girok-tab-l1__item">홈</button>
          <button class="vds-pattern-girok-tab-l1__item is-active">가계부</button>
          <button class="vds-pattern-girok-tab-l1__item">저축</button>
          <button class="vds-pattern-girok-tab-l1__item">분석</button>
        </div>
      </nav>

      <section class="section">
        <div class="vds-pattern-girok-tab-l2">
          <div class="vds-pattern-girok-tab-l2__indicator"></div>
          <button class="vds-pattern-girok-tab-l2__cell">캘린더</button>
          <button class="vds-pattern-girok-tab-l2__cell is-active">내역 조회</button>
          <button class="vds-pattern-girok-tab-l2__cell">예산</button>
        </div>

        <div class="stats-wrap vds-pattern-girok-stats">
          <div class="vds-pattern-girok-stats__cell">
            <div class="vds-pattern-girok-stats__label">수입</div>
            <div class="vds-pattern-girok-stats__value is-income">+3,500,000</div>
          </div>
          <div class="vds-pattern-girok-stats__cell">
            <div class="vds-pattern-girok-stats__label">지출</div>
            <div class="vds-pattern-girok-stats__value is-expense">-0</div>
          </div>
          <div class="vds-pattern-girok-stats__cell">
            <div class="vds-pattern-girok-stats__label">잔액</div>
            <div class="vds-pattern-girok-stats__value is-remaining">3,500,000</div>
          </div>
        </div>
      </section>

      <section class="sheet-stage">
        <div class="vds-pattern-bottomsheet__backdrop"></div>
        <div class="vds-pattern-bottomsheet__sheet is-daily">
          <div class="vds-pattern-bottomsheet__handle"></div>
          <div class="vds-pattern-bottomsheet__header">
            <div class="sheet-header-copy">
              <h2 class="vds-pattern-bottomsheet__title">7월 10일</h2>
              <div class="vds-pattern-bottomsheet__subtitle">
                <span class="subtitle-stat-income">수입 +3,500,000</span>
                <span class="subtitle-sep">|</span>
                <span class="subtitle-stat-expense">지출 -0</span>
              </div>
            </div>
            <button class="vds-pattern-bottomsheet__close" aria-label="닫기">×</button>
          </div>
          <div class="vds-pattern-bottomsheet__body">
            <div class="entry-card">
              <div class="entry-left">
                <div class="entry-icon">월</div>
                <div>
                  <div class="entry-title">7월 급여</div>
                  <div class="entry-subtitle">월급</div>
                </div>
              </div>
              <div class="entry-amount">+3,500,000</div>
            </div>
          </div>
          <div class="vds-pattern-bottomsheet__footer">
            <button class="vds-pattern-bottomsheet__cta">+ 이 날짜에 새로 등록하기</button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
