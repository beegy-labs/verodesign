<!doctype html>
<html lang="ko" data-theme="girok" data-mode="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>girok pass3 browser</title>
    <link rel="stylesheet" href="../packages/design/dist/css/core.css" />
    <link rel="stylesheet" href="../packages/design/dist/css/themes/girok.css" />
    <link rel="stylesheet" href="../packages/design/dist/patterns/girok-app.css" />
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #0b0b10;
        color: var(--vds-theme-text-bright);
        font-family: var(--vds-font-family-sans);
      }

      .screen {
        width: 393px;
        height: 852px;
        margin: 0 auto;
        background: #0d0b08;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
      }

      .safe-top {
        padding: 46px 24px 0;
      }

      .status {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 34px;
        color: #f2f0f3;
        font-size: 18px;
        font-weight: 800;
      }

      .status-right {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .signal {
        width: 27px;
        height: 14px;
        border: 2px solid #c9c6d0;
        border-radius: 5px;
        position: relative;
      }

      .signal::after {
        content: "";
        position: absolute;
        top: 2px;
        right: 2px;
        width: 15px;
        height: 6px;
        border-radius: 2px;
        background: #c9c6d0;
      }

      .hero {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 34px;
      }

      .l1-wrap {
        padding: 0 0 0 0;
      }

      .section-rule {
        height: 1px;
        background: color-mix(in oklab, var(--vds-theme-border-subtle) 42%, transparent);
      }

      .content {
        padding: 24px 24px 120px;
        flex: 1;
      }

      .toolbar-row {
        margin-top: 38px;
      }

      .toolbar-row .vds-pattern-girok-month-pill {
        width: 154px;
      }

      .toolbar-row .vds-pattern-girok-register-chip {
        width: 84px;
      }

      .toolbar-row .vds-pattern-girok-view-toggle {
        width: 92px;
        justify-content: space-between;
      }

      .stats-row {
        margin-top: 40px;
      }

      .stats-row .vds-pattern-girok-stats {
        width: 100%;
      }

      .calendar-wrap {
        margin-top: 20px;
      }

      .vds-pattern-girok-bottom-nav {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
      }
    </style>
  </head>
  <body>
    <main class="screen">
      <div class="safe-top">
        <div class="status">
          <div>16:45</div>
          <div class="status-right">
            <div>5G</div>
            <div class="signal"></div>
          </div>
        </div>

        <div class="hero">
          <div class="vds-pattern-girok-wordmark">girok<span class="vds-pattern-girok-wordmark__dot">.</span></div>
          <div class="vds-pattern-girok-icon-actions" aria-label="header actions">
            <button class="vds-pattern-girok-icon-button" aria-label="알림">
              <svg viewBox="0 0 24 24"><path d="M15 17h5l-1.4-1.4a2 2 0 0 1-.6-1.4V11a6 6 0 1 0-12 0v3.2a2 2 0 0 1-.6 1.4L4 17h5"/><path d="M10 17a2 2 0 0 0 4 0"/></svg>
            </button>
            <button class="vds-pattern-girok-icon-button" aria-label="설정">
              <svg viewBox="0 0 24 24"><path d="M12 8.8A3.2 3.2 0 1 0 12 15.2A3.2 3.2 0 1 0 12 8.8z"/><path d="M19.4 15a1 1 0 0 0 .2 1.1l.1.1a1.8 1.8 0 0 1 0 2.5l-.1.1a1.8 1.8 0 0 1-2.5 0l-.1-.1a1 1 0 0 0-1.1-.2 1 1 0 0 0-.6.9V20a1.8 1.8 0 0 1-1.8 1.8h-.2A1.8 1.8 0 0 1 11.5 20v-.2a1 1 0 0 0-.6-.9 1 1 0 0 0-1.1.2l-.1.1a1.8 1.8 0 0 1-2.5 0l-.1-.1a1.8 1.8 0 0 1 0-2.5l.1-.1a1 1 0 0 0 .2-1.1 1 1 0 0 0-.9-.6H6a1.8 1.8 0 0 1-1.8-1.8v-.2A1.8 1.8 0 0 1 6 10.5h.2a1 1 0 0 0 .9-.6 1 1 0 0 0-.2-1.1l-.1-.1a1.8 1.8 0 0 1 0-2.5l.1-.1a1.8 1.8 0 0 1 2.5 0l.1.1a1 1 0 0 0 1.1.2 1 1 0 0 0 .6-.9V4A1.8 1.8 0 0 1 13 2.2h.2A1.8 1.8 0 0 1 15 4v.2a1 1 0 0 0 .6.9 1 1 0 0 0 1.1-.2l.1-.1a1.8 1.8 0 0 1 2.5 0l.1.1a1.8 1.8 0 0 1 0 2.5l-.1.1a1 1 0 0 0-.2 1.1 1 1 0 0 0 .9.6h.2A1.8 1.8 0 0 1 21.8 11v.2A1.8 1.8 0 0 1 20 13h-.2a1 1 0 0 0-.9.6z"/></svg>
            </button>
          </div>
        </div>
      </div>

      <nav class="vds-pattern-girok-tab-l1 l1-wrap">
        <div class="vds-pattern-girok-tab-l1__scroll">
          <button class="vds-pattern-girok-tab-l1__item is-active">가계부</button>
          <button class="vds-pattern-girok-tab-l1__item">투자</button>
          <button class="vds-pattern-girok-tab-l1__item">자산</button>
          <button class="vds-pattern-girok-tab-l1__item">부채</button>
          <button class="vds-pattern-girok-tab-l1__item">설정</button>
        </div>
      </nav>

      <div class="section-rule"></div>

      <section class="content">
        <div class="vds-pattern-girok-tab-l2">
          <div class="vds-pattern-girok-tab-l2__indicator"></div>
          <button class="vds-pattern-girok-tab-l2__cell is-active">내역 조회</button>
          <button class="vds-pattern-girok-tab-l2__cell">소비 분석</button>
          <button class="vds-pattern-girok-tab-l2__cell">가계부 관리</button>
        </div>

        <div class="vds-pattern-girok-toolbar toolbar-row">
          <div class="vds-pattern-girok-month-pill">
            <span class="vds-pattern-girok-month-pill__chevron">‹</span>
            <span class="vds-pattern-girok-month-pill__label">2026년 7월</span>
            <span class="vds-pattern-girok-month-pill__chevron">›</span>
          </div>
          <button class="vds-pattern-girok-register-chip">등록</button>
          <div class="vds-pattern-girok-view-toggle">
            <button class="vds-pattern-girok-view-toggle__item is-active" aria-label="캘린더 보기">
              <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>
            </button>
            <button class="vds-pattern-girok-view-toggle__item" aria-label="리스트 보기">
              <svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M5 6h.01M5 12h.01M5 18h.01"/></svg>
            </button>
          </div>
        </div>

        <div class="stats-row">
          <div class="vds-pattern-girok-stats">
            <div class="vds-pattern-girok-stats__cell">
              <div class="vds-pattern-girok-stats__label">기간 수입</div>
              <div class="vds-pattern-girok-stats__value is-income">+3,500,000</div>
            </div>
            <div class="vds-pattern-girok-stats__cell">
              <div class="vds-pattern-girok-stats__label">기간 지출</div>
              <div class="vds-pattern-girok-stats__value is-expense">-245,490</div>
            </div>
            <div class="vds-pattern-girok-stats__cell">
              <div class="vds-pattern-girok-stats__label">남은 금액</div>
              <div class="vds-pattern-girok-stats__value is-remaining">3,254,510</div>
            </div>
          </div>
        </div>

        <div class="calendar-wrap">
          <div class="vds-pattern-girok-calendar">
            <div class="vds-pattern-girok-calendar__weekdays">
              <div class="vds-pattern-girok-calendar__weekday">월</div>
              <div class="vds-pattern-girok-calendar__weekday">화</div>
              <div class="vds-pattern-girok-calendar__weekday">수</div>
              <div class="vds-pattern-girok-calendar__weekday">목</div>
              <div class="vds-pattern-girok-calendar__weekday">금</div>
              <div class="vds-pattern-girok-calendar__weekday is-saturday">토</div>
              <div class="vds-pattern-girok-calendar__weekday is-sunday">일</div>
            </div>

            <div class="vds-pattern-girok-calendar__grid">
              <div class="vds-pattern-girok-calendar__cell"></div>
              <div class="vds-pattern-girok-calendar__cell"></div>
              <div class="vds-pattern-girok-calendar__cell is-day"><div class="vds-pattern-girok-calendar__date">1</div></div>
              <div class="vds-pattern-girok-calendar__cell is-day"><div class="vds-pattern-girok-calendar__date">2</div><div class="vds-pattern-girok-calendar__dot"></div></div>
              <div class="vds-pattern-girok-calendar__cell is-day"><div class="vds-pattern-girok-calendar__date">3</div></div>
              <div class="vds-pattern-girok-calendar__cell is-day"><div class="vds-pattern-girok-calendar__date">4</div></div>
              <div class="vds-pattern-girok-calendar__cell is-day"><div class="vds-pattern-girok-calendar__date">5</div></div>

              <div class="vds-pattern-girok-calendar__cell is-day"><div class="vds-pattern-girok-calendar__date">6</div></div>
              <div class="vds-pattern-girok-calendar__cell is-day"><div class="vds-pattern-girok-calendar__date">7</div></div>
              <div class="vds-pattern-girok-calendar__cell is-day"><div class="vds-pattern-girok-calendar__date">8</div></div>
              <div class="vds-pattern-girok-calendar__cell is-day"><div class="vds-pattern-girok-calendar__date">9</div></div>
              <div class="vds-pattern-girok-calendar__cell is-day"><div class="vds-pattern-girok-calendar__date">10</div><div class="vds-pattern-girok-calendar__dot"></div></div>
              <div class="vds-pattern-girok-calendar__cell is-day"><div class="vds-pattern-girok-calendar__date">11</div></div>
              <div class="vds-pattern-girok-calendar__cell is-day"><div class="vds-pattern-girok-calendar__date">12</div></div>

              <div class="vds-pattern-girok-calendar__cell is-day"><div class="vds-pattern-girok-calendar__date">13</div></div>
              <div class="vds-pattern-girok-calendar__cell is-day"><div class="vds-pattern-girok-calendar__date">14</div></div>
              <div class="vds-pattern-girok-calendar__cell is-day"><div class="vds-pattern-girok-calendar__date">15</div><div class="vds-pattern-girok-calendar__dot"></div></div>
              <div class="vds-pattern-girok-calendar__cell is-day"><div class="vds-pattern-girok-calendar__date">16</div></div>
              <div class="vds-pattern-girok-calendar__cell is-day"><div class="vds-pattern-girok-calendar__date">17</div></div>
              <div class="vds-pattern-girok-calendar__cell is-day"><div class="vds-pattern-girok-calendar__date">18</div><div class="vds-pattern-girok-calendar__dot"></div></div>
              <div class="vds-pattern-girok-calendar__cell is-day"><div class="vds-pattern-girok-calendar__date">19</div><div class="vds-pattern-girok-calendar__dot"></div></div>

              <div class="vds-pattern-girok-calendar__cell is-day is-today"><div class="vds-pattern-girok-calendar__date">20</div></div>
              <div class="vds-pattern-girok-calendar__cell is-day"><div class="vds-pattern-girok-calendar__date">21</div></div>
              <div class="vds-pattern-girok-calendar__cell is-day"><div class="vds-pattern-girok-calendar__date">22</div></div>
              <div class="vds-pattern-girok-calendar__cell is-day"><div class="vds-pattern-girok-calendar__date">23</div></div>
              <div class="vds-pattern-girok-calendar__cell is-day"><div class="vds-pattern-girok-calendar__date">24</div></div>
              <div class="vds-pattern-girok-calendar__cell is-day"><div class="vds-pattern-girok-calendar__date">25</div></div>
              <div class="vds-pattern-girok-calendar__cell is-day"><div class="vds-pattern-girok-calendar__date">26</div></div>

              <div class="vds-pattern-girok-calendar__cell is-day"><div class="vds-pattern-girok-calendar__date">27</div></div>
              <div class="vds-pattern-girok-calendar__cell is-day"><div class="vds-pattern-girok-calendar__date">28</div></div>
              <div class="vds-pattern-girok-calendar__cell is-day"><div class="vds-pattern-girok-calendar__date">29</div></div>
              <div class="vds-pattern-girok-calendar__cell is-day"><div class="vds-pattern-girok-calendar__date">30</div></div>
              <div class="vds-pattern-girok-calendar__cell is-day"><div class="vds-pattern-girok-calendar__date">31</div></div>
              <div class="vds-pattern-girok-calendar__cell"></div>
              <div class="vds-pattern-girok-calendar__cell"></div>
            </div>
          </div>
        </div>
      </section>

      <nav class="vds-pattern-girok-bottom-nav">
        <div class="vds-pattern-girok-bottom-nav__item">
          <svg viewBox="0 0 24 24"><path d="M3 10.5 12 4l9 6.5V20H3z"/><path d="M9 20v-5h6v5"/></svg>
          <span>홈</span>
        </div>
        <div class="vds-pattern-girok-bottom-nav__item is-active">
          <svg viewBox="0 0 24 24"><path d="M4 7.5h10.5A3.5 3.5 0 0 1 18 11v6.5H7.5A3.5 3.5 0 0 1 4 14z"/><path d="M14 7.5V6a2 2 0 0 0-2-2H6"/><path d="M18 12h2"/></svg>
          <span>가계부</span>
        </div>
        <div class="vds-pattern-girok-bottom-nav__item">
          <svg viewBox="0 0 24 24"><path d="M3 13c3.5 0 3.5-7 7-7s3.5 12 7 12 3.5-6 4-6"/></svg>
          <span>활동</span>
        </div>
        <div class="vds-pattern-girok-bottom-nav__item">
          <svg viewBox="0 0 24 24"><path d="M5 8h14v11H5z"/><path d="M8 8a4 4 0 0 1 8 0"/><path d="M9 12h6"/></svg>
          <span>상점</span>
        </div>
        <div class="vds-pattern-girok-bottom-nav__item">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          <span>메뉴</span>
        </div>
      </nav>
    </main>
  </body>
</html>
