name: CI (verodesign)

# PR checks for any package change. Self-hosted only (arc-runner-set) — never
# ubuntu-latest. No publish — that happens on merge to main in release.yml.

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'turbo.json'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.changeset/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: arc-runner-set
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Deps resolve through the in-cluster Verdaccio (npmjs pull-through cache).
      - name: Configure registry
        run: printf 'registry=https://npm.beegy.net/\n@verobee:registry=https://npm.beegy.net/\n' > .npmrc
      # Exclude @verobee/showcase — it has its own gate (showcase.yml) and its
      # storybook/playwright/chromatic devDeps are unused here. Installing them
      # cold-hammers the shared Verdaccio cache for nothing.
      - name: Install
        run: pnpm install --frozen-lockfile --filter '!@verobee/showcase'
      - name: Typecheck
        run: pnpm exec turbo run validate --filter='!@verobee/showcase'
      - name: Build
        run: pnpm exec turbo run build --filter='!@verobee/showcase'
      - name: Test
        run: pnpm exec turbo run test --filter='!@verobee/showcase'

  design-patterns:
    runs-on: arc-runner-set
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Configure registry
        run: printf 'registry=https://npm.beegy.net/\n@verobee:registry=https://npm.beegy.net/\n' > .npmrc
      # Only @verobee/design + its deps are exercised below — install just that
      # subtree (keeps the storybook/playwright/showcase tree off the cache).
      - name: Install
        run: pnpm install --frozen-lockfile --filter '@verobee/design...'
      - name: Audit DTCG tokens
        run: pnpm --filter @verobee/design audit:tokens-dtcg
      - name: Build design package
        run: pnpm --filter @verobee/design build
      - name: Audit pattern spacing
        run: pnpm --filter @verobee/design audit:pattern-spacing
      - name: Audit girok pattern files
        run: pnpm --filter @verobee/design audit:pattern-files
      - name: Verify girok pattern bundle outputs
        run: |
          test -f packages/design/dist/patterns/girok-app.css
          test -f packages/design/dist/patterns/girok-app.min.css
