name: Showcase (build gate)

# Build GATE only for the Astro showcase site (arc-runner-set, no DinD). The
# container image build + K8s deploy are DEFERRED: they will run as an
# ARC-independent kaniko app in platform-gitops (never docker buildx on the
# runner), then deploy via ArgoCD — same pattern as collector-image-build.
# SSOT: docs/llm/platform/ci-cd-strategy.md.

on:
  push:
    branches: [main]
    paths:
      - 'packages/showcase/**'
      - 'packages/spec/**'
      - 'packages/primitive/**'
      - 'packages/theme-*/**'
      - 'packages/utilities/**'
      - 'packages/design-elements/**'
      - '.github/workflows/showcase.yml'
  pull_request:
    paths:
      - 'packages/showcase/**'
      - '.github/workflows/showcase.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build showcase
    runs-on: arc-runner-set
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Configure registry
        run: printf 'registry=https://npm.beegy.net/\n@verobee:registry=https://npm.beegy.net/\n' > .npmrc
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build dependent packages
        run: pnpm --filter '@verobee/showcase^...' build
      - name: Build showcase
        run: pnpm --filter @verobee/showcase build
